<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<title>My To-Do List</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f2faf4;--card:#ffffff;--ink:#35503f;--muted:#7f9a88;--line:#d9ede0;--accent:#a6dbb9;--accent-ink:#244433;--hi:#ee5d5d;--md:#f2b134;--lo:#4f9fe0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="pink"]{--bg:#fdf3f6;--ink:#563944;--muted:#a08591;--line:#f5dce4;--accent:#f4b6c8;--accent-ink:#512637}
:root[data-theme="lavender"]{--bg:#f6f3fc;--ink:#463f5e;--muted:#8d86a8;--line:#e3ddf3;--accent:#c9b8ef;--accent-ink:#2f2552}
:root[data-theme="peach"]{--bg:#fff6ef;--ink:#5a4332;--muted:#a58d7b;--line:#f7e1d0;--accent:#f7c5a1;--accent-ink:#4f2c14}
:root[data-theme="sky"]{--bg:#f0f8fd;--ink:#34495a;--muted:#7f9bad;--line:#d8eaf5;--accent:#a8d4ee;--accent-ink:#173449}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,"Iowan Old Style",serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 12px;font-size:15px}
.sw{display:flex;gap:10px;margin:0 0 14px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
input,button,textarea{font:inherit;color:inherit}
input[type=text],input[type=date],textarea{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-width:0;width:100%}
textarea{resize:vertical;min-height:44px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.week{margin:0 0 12px}
.wh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wh b{font-weight:600}
.wh button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:38px;height:34px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 0;display:grid;justify-items:center;gap:1px;font-size:12px;color:var(--muted)}
.days button span{font-size:16px;color:var(--ink)}
.days button i{width:5px;height:5px;border-radius:50%;background:transparent}
.days button.has i{background:var(--accent)}
.days button.today{border-color:var(--accent);border-width:2px}
.days button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button.on span{color:var(--accent-ink)}
.days button.today span{background:var(--ink);color:var(--card);border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.dayt{margin:0 0 8px;color:var(--muted);font-size:14px}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}
.add{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:0 18px;font-weight:600}
.fld{margin-bottom:10px}
.fld>small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;color:var(--muted);font-size:14px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pri button::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--lo)}
.pri button[data-v=high]::before{background:var(--hi)}
.pri button[data-v=medium]::before{background:var(--md)}
.tabs{display:flex;gap:6px;margin:16px 0 8px}
.tabs button{flex:1;padding:8px 2px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--muted);font-size:14px}
.tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tools{display:grid;gap:8px;margin-bottom:12px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--lo);border-radius:12px;padding:12px}
li.high{border-left-color:var(--hi)}li.medium{border-left-color:var(--md)}li.low{border-left-color:var(--lo)}
li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:2px}
.t{flex:1;min-width:0;word-break:break-word}
.t .txt{cursor:pointer}
.t input.ed{padding:6px 8px}
.t small{display:block;color:var(--muted);font-size:13px}
.t .note{white-space:pre-wrap;margin-top:2px}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 8px;margin-right:6px;font-size:12px;color:var(--muted)}
li.done .txt{text-decoration:line-through;color:var(--muted)}
li.late .due{color:#c0605a}
.x{background:none;border:0;color:var(--muted);font-size:20px;padding:2px 8px;border-radius:8px}
.x:hover{color:#c0605a}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:14px;gap:8px;flex-wrap:wrap}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:4px}
.setup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:20px;display:grid;gap:10px}
.setup p{margin:0;color:var(--muted);font-size:14px}
.status{font-size:12px;color:var(--muted);margin:-6px 0 10px}
.ro{color:var(--muted);font-size:14px;margin:0 0 10px}
[hidden]{display:none!important}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<main>
  <div class="setup" id="setup" hidden>
    <h1 style="margin:0">Shared to-do list</h1>
    <p>Enter your name and a secret room code. Use the same room code on your partner's phone, with a different name.</p>
    <input type="text" id="sn" placeholder="Your name" maxlength="20" autocomplete="off">
    <input type="text" id="sr" placeholder="Room code (8+ characters, keep it secret)" maxlength="40" autocomplete="off">
    <button class="add" id="sgo" style="padding:12px">Start</button>
    <p id="serr" style="color:#c0605a"></p>
  </div>
  <div id="app" hidden>
  <h1>To-do list</h1>
  <p class="sub" id="sub"></p>
  <div class="sw" id="sw">
    <button data-t="green" style="background:#a6dbb9" aria-label="Green theme"></button>
    <button data-t="pink" style="background:#f4b6c8" aria-label="Pink theme"></button>
    <button data-t="lavender" style="background:#c9b8ef" aria-label="Lavender theme"></button>
    <button data-t="peach" style="background:#f7c5a1" aria-label="Peach theme"></button>
    <button data-t="sky" style="background:#a8d4ee" aria-label="Blue theme"></button>
  </div>
  <div class="status" id="status"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="chips" id="views" style="margin-bottom:12px"></div>
  <div class="week" id="week">
    <div class="wh"><button id="pw" aria-label="Previous week">&lsaquo;</button><b id="wt"></b><button id="nw" aria-label="Next week">&rsaquo;</button></div>
    <div class="days" id="days"></div>
  </div>
  <p class="dayt" id="dayt" hidden></p>
  <p class="ro" id="ro" hidden>View only. You can see this list but not change it.</p>
  <form id="f">
    <div class="row">
      <input type="text" id="txt" placeholder="What do you need to do?" maxlength="120" autocomplete="off" aria-label="New task">
      <button class="add" type="submit">Add</button>
    </div>
    <div class="fld"><small>Priority</small>
      <div class="chips pri" id="pri"><button type="button" data-v="high">High</button><button type="button" data-v="medium" class="on">Medium</button><button type="button" data-v="low">Low</button></div></div>
    <div class="fld"><small>Category</small>
      <div class="chips" id="cat"><button type="button" data-v="Study" class="on">Study</button><button type="button" data-v="Work">Work</button><button type="button" data-v="Date">Date</button><button type="button" data-v="Personal">Personal</button><button type="button" data-v="Health">Health</button><button type="button" data-v="Shopping">Shopping</button><button type="button" data-v="Other">Other</button></div></div>
    <div class="fld"><small>Due</small>
      <div class="chips" id="due"><button type="button" data-v="sel" class="on" id="dsel">Selected day</button><button type="button" data-v="today" id="dtoday">Today</button><button type="button" data-v="tom">Tomorrow</button><button type="button" data-v="pick">Pick date</button><button type="button" data-v="none">No date</button></div>
      <input type="date" id="pd" aria-label="Pick a due date" hidden style="margin-top:8px"></div>
    <div class="fld"><small>Repeat</small>
      <div class="chips" id="rep"><button type="button" data-v="" class="on">Never</button><button type="button" data-v="daily">Daily</button><button type="button" data-v="weekly">Weekly</button></div></div>
    <textarea id="note" placeholder="Notes (optional)" maxlength="300" aria-label="Notes"></textarea>
  </form>
  <div class="tabs" id="tabs">
    <button data-f="all">All</button><button data-f="open">To do</button><button data-f="done">Done</button>
  </div>
  <div class="tools">
    <input type="text" id="q" placeholder="Search tasks" aria-label="Search tasks">
    <div class="chips" id="fc"><button type="button" data-v="" class="on">All</button><button type="button" data-v="Study">Study</button><button type="button" data-v="Work">Work</button><button type="button" data-v="Date">Date</button><button type="button" data-v="Personal">Personal</button><button type="button" data-v="Health">Health</button><button type="button" data-v="Shopping">Shopping</button><button type="button" data-v="Other">Other</button></div>
  </div>
  <ul id="list"></ul>
  <div class="foot"><span id="count"></span><span><button id="imp" hidden>Import old tasks</button><button id="copy">Copy list</button><button id="clear">Clear done</button><button id="chg">Change name/room</button></span></div>
  </div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var firebaseConfig={apiKey:"AIzaSyCP82N_ZmdtxqPJy07pQUGsr0NxFg6O0TQ",authDomain:"todo-list-3121.firebaseapp.com",databaseURL:"https://todo-list-3121-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"todo-list-3121",storageBucket:"todo-list-3121.firebasestorage.app",messagingSenderId:"7936629028",appId:"1:7936629028:web:5eb7b1fafd3b235a583bb1"};
var all=[],tasks=[],filter="day",KEY="todo-v1",SK="todo-setup",me="",room="",view="me",ref=null;
function owner(){return view=="me"?me:view}
function canEdit(t){return t.o==me||t.o=="together"}
function upd(t,o){if(ref)ref.child(t.id).update(o)}
function add(t){if(ref)ref.push(t)}
function save(){}
function iso(d){var m=d.getMonth()+1,k=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(k<10?"0":"")+k}
function parse(s){var p=s.split("-");return new Date(p[0],p[1]-1,p[2])}
function fmt(d){return parse(d).toLocaleDateString(undefined,{day:"numeric",month:"short"})}
function addDays(s,n){var x=parse(s);x.setDate(x.getDate()+n);return iso(x)}
var sel=iso(new Date()),rank={high:0,medium:1,low:2};
var pri="medium",cat="Study",dm="sel",rep="",fcat="";
/* chip groups: tap one, it highlights, value is stored */
function group(id,cb){$(id).onclick=function(e){var b=e.target.closest("button");if(!b)return;
  [].forEach.call($(id).children,function(c){c.classList.toggle("on",c===b)});cb(b.dataset.v)}}
group("pri",function(v){pri=v});
group("cat",function(v){cat=v});
group("rep",function(v){rep=v});
group("due",function(v){dm=v;$("pd").hidden=v!="pick"});
group("fc",function(v){fcat=v;render()});
function dueVal(){var t=iso(new Date());
  if(dm=="sel")return sel;if(dm=="today")return t;if(dm=="tom")return addDays(t,1);
  if(dm=="pick")return $("pd").value;return ""}
function renderWeek(){
  var on=filter=="day";$("dayt").hidden=!on;
  var tdy=iso(new Date()),x=parse(sel);
  $("dayt").textContent=(sel==tdy?"Today, ":"")+x.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  var st=new Date(x);st.setDate(x.getDate()-((x.getDay()+6)%7));
  var en=new Date(st);en.setDate(st.getDate()+6),o={day:"numeric",month:"short"};
  $("wt").textContent=st.toLocaleDateString(undefined,o)+" – "+en.toLocaleDateString(undefined,o);
  var box=$("days");box.innerHTML="";
  for(var i=0;i<7;i++){
    var d=new Date(st);d.setDate(st.getDate()+i);var k=iso(d);
    var b=document.createElement("button");b.dataset.d=k;
    b.className=(k==sel&&on?"on ":"")+(k==tdy?"today ":"")+(tasks.some(function(t){return t.d==k&&!t.done})?"has":"");
    b.innerHTML=d.toLocaleDateString(undefined,{weekday:"short"})+"<span>"+d.getDate()+"</span><i></i>";
    box.appendChild(b);
  }
  $("dsel").textContent=sel==tdy?"Today":x.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
  $("dtoday").hidden=sel==tdy;
}
function render(){
  tasks=all.filter(function(t){return t.o==owner()});
  renderViews();
  $("f").hidden=!(view=="me"||view=="together");$("ro").hidden=!$("f").hidden;
  renderWeek();
  var today=iso(new Date()),q=$("q").value.toLowerCase();
  var shown=tasks.filter(function(t){
    if(filter=="day"&&t.d!=sel)return false;
    if(filter=="done"&&!t.done)return false;
    if(filter=="open"&&t.done)return false;
    if(fcat&&t.c!=fcat)return false;
    if(q&&(t.text+" "+(t.n||"")).toLowerCase().indexOf(q)<0)return false;
    return true});
  shown.sort(function(a,b){return a.done-b.done||rank[a.p]-rank[b.p]||(a.d||"9").localeCompare(b.d||"9")});
  var ul=$("list");ul.innerHTML="";
  if(!shown.length){ul.innerHTML='<div class="empty">Nothing here. Add a task above.</div>'}
  shown.forEach(function(t){
    var li=document.createElement("li");
    li.className=t.p+(t.done?" done":"")+(t.d&&t.d<today&&!t.done?" late":"");
    var c=document.createElement("input");c.type="checkbox";c.checked=t.done;c.setAttribute("aria-label","Mark done");
    c.disabled=!canEdit(t);
    c.onchange=function(){
      upd(t,{done:c.checked});
      if(c.checked&&t.r&&t.d){add({text:t.text,p:t.p,c:t.c,d:addDays(t.d,t.r=="daily"?1:7),r:t.r,n:t.n||"",done:false,o:t.o})}};
    var box=document.createElement("div");box.className="t";
    var s=document.createElement("span");s.className="txt";s.textContent=t.text;
    if(canEdit(t))s.onclick=function(){
      var inp=document.createElement("input");inp.type="text";inp.className="ed";inp.value=t.text;inp.maxLength=120;
      var fin=function(ok){if(ok&&inp.value.trim())upd(t,{text:inp.value.trim()});render()};
      inp.onkeydown=function(e){if(e.key=="Enter")fin(true);if(e.key=="Escape")fin(false)};
      inp.onblur=function(){fin(true)};
      box.replaceChild(inp,s);inp.focus();inp.select()};
    box.appendChild(s);
    var m=document.createElement("small");
    var ch=document.createElement("span");ch.className="chip";ch.textContent=t.c||"Other";m.appendChild(ch);
    if(t.d){var d=document.createElement("span");d.className="due";
      d.textContent=t.d==today?"Today":(t.d<today&&!t.done?"Overdue: ":"Due ")+fmt(t.d);m.appendChild(d)}
    if(t.r){var r=document.createElement("span");r.textContent=" · repeats "+t.r;m.appendChild(r)}
    box.appendChild(m);
    if(t.n){var n=document.createElement("small");n.className="note";n.textContent=t.n;box.appendChild(n)}
    var x=document.createElement("button");x.className="x";x.textContent="×";x.setAttribute("aria-label","Delete task");
    x.onclick=function(){if(ref)ref.child(t.id).remove()};
    if(canEdit(t))li.append(c,box,x);else li.append(c,box);ul.appendChild(li);
  });
  var done=tasks.filter(function(t){return t.done}).length,n=tasks.length;
  $("bar").style.width=(n?done/n*100:0)+"%";
  $("sub").textContent=n?done+" of "+n+" done":"Plan your day";
  $("count").textContent=(n-done)+" left";
}
$("f").onsubmit=function(e){
  e.preventDefault();var v=$("txt").value.trim();if(!v)return;
  var d=dueVal();if(rep&&!d)d=iso(new Date());
  add({text:v,p:pri,c:cat,d:d,r:rep,n:$("note").value.trim(),done:false,o:owner()});
  $("txt").value="";$("note").value="";$("txt").focus();
};
function setFilter(f){filter=f;[].forEach.call($("tabs").children,function(b){b.classList.toggle("on",b.dataset.f==f)});render()}
$("tabs").onclick=function(e){var f=e.target.dataset&&e.target.dataset.f;if(f)setFilter(f)};
$("days").onclick=function(e){var b=e.target.closest("button");if(b){sel=b.dataset.d;setFilter("day")}};
$("pw").onclick=function(){sel=addDays(sel,-7);setFilter("day")};
$("nw").onclick=function(){sel=addDays(sel,7);setFilter("day")};
$("q").oninput=render;
$("clear").onclick=function(){tasks.forEach(function(t){if(t.done&&canEdit(t))ref.child(t.id).remove()})};
$("copy").onclick=function(){
  var txt=tasks.map(function(t){return (t.done?"[x] ":"[ ] ")+t.text+(t.d?" (due "+t.d+")":"")}).join("\n");
  try{navigator.clipboard.writeText(txt);$("copy").textContent="Copied!";setTimeout(function(){$("copy").textContent="Copy list"},1500)}catch(e){prompt("Copy your list",txt)}};
var TK="todo-theme";
function setTheme(t){document.documentElement.setAttribute("data-theme",t);
  [].forEach.call($("sw").children,function(b){b.classList.toggle("on",b.dataset.t==t)});
  try{localStorage.setItem(TK,t)}catch(e){}}
$("sw").onclick=function(e){var t=e.target.dataset&&e.target.dataset.t;if(t)setTheme(t)};
var st="green";try{st=localStorage.getItem(TK)||"green"}catch(e){}
setTheme(st);
function renderViews(){
  var names=[];all.forEach(function(t){if(t.o!=me&&t.o!="together"&&names.indexOf(t.o)<0)names.push(t.o)});
  var items=[["me","Mine"],["together","Together"]].concat(names.map(function(n){return [n,n]}));
  var box=$("views");box.innerHTML="";
  items.forEach(function(it){var b=document.createElement("button");b.type="button";b.dataset.v=it[0];b.textContent=it[1];
    if(it[0]==view)b.className="on";box.appendChild(b)});
}
$("views").onclick=function(e){var b=e.target.closest("button");if(b){view=b.dataset.v;render()}};
function startApp(){
  $("setup").hidden=true;$("app").hidden=false;
  try{firebase.initializeApp(firebaseConfig);var db=firebase.database();
    ref=db.ref("rooms/"+room+"/tasks");
    ref.on("value",function(s){all=[];s.forEach(function(c){var t=c.val();t.id=c.key;all.push(t)});render()},
      function(){$("status").textContent="Cannot connect. Check the database rules."});
    db.ref(".info/connected").on("value",function(s){$("status").textContent=s.val()?"Synced as "+me:"Offline. Reconnecting..."});
  }catch(e){$("status").textContent="Cannot connect to the database."}
  var old=[];try{old=(JSON.parse(localStorage.getItem(KEY))||[]).filter(function(t){return t&&t.text})}catch(e){}
  var done=false;try{done=localStorage.getItem("todo-imported")=="1"}catch(e){}
  if(old.length&&!done){$("imp").hidden=false;$("imp").textContent="Import old tasks ("+old.length+")";
    $("imp").onclick=function(){old.forEach(function(t){t.o=me;add(t)});try{localStorage.setItem("todo-imported","1")}catch(e){}$("imp").hidden=true}}
  render();
}
function showSetup(){$("app").hidden=true;$("setup").hidden=false;$("sn").value=me;$("sr").value=room}
$("sgo").onclick=function(){
  var n=$("sn").value.trim(),r=$("sr").value.trim().toLowerCase().replace(/[.#$\[\]\/\s]/g,"-");
  if(!n||n.toLowerCase()=="together"||n.toLowerCase()=="me"){$("serr").textContent="Please enter a name (not \"me\" or \"together\").";return}
  if(r.length<8){$("serr").textContent="The room code needs at least 8 characters.";return}
  try{localStorage.setItem(SK,JSON.stringify({n:n,r:r}))}catch(e){}
  me=n;room=r;location.reload()};
$("chg").onclick=function(){showSetup()};
(function(){var st=null;try{st=JSON.parse(localStorage.getItem(SK))}catch(e){}
  if(st&&st.n&&st.r){me=st.n;room=st.r;startApp()}else showSetup()})();
</script>
</body>
</html>
